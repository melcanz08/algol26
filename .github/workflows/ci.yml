name: CI - Clippy & Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  clippy-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy lib -D warnings (0 allowed)
        run: cargo clippy --lib -- -D warnings

      - name: Clippy tests (warn only for now)
        run: cargo clippy --tests -- -D warnings || echo "tests clippy needs cleanup - lib is enforced"

      - name: Build
        run: cargo build

      - name: Tests (150 tests)
        run: cargo test -- --test-threads=2

      - name: Project Check
        run: ./tools/check_project.sh