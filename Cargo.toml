[package]
name = "algol26"
version = "0.8.0"
edition = "2021"
description = "ALGOL 58 reimagined for 2026 - a historically inspired systems programming language"
authors = ["Rommel Edorot Caneos"]
license = "MIT"
repository = "https://github.com/melcanz08/algol26"
keywords = ["compiler", "programming-language", "llvm", "algol"]
categories = ["compilers"]
rust-version = "1.70"

[dependencies]
inkwell = { version = "0.7.1", features = ["llvm17-0", "llvm17-0-prefer-dynamic", "target-webassembly"], default-features = false }
lazy_static = "1.4"

[lib]
name = "algol26"
path = "src/lib.rs"

[[bin]]
name = "algol26"
path = "src/main.rs"

[dev-dependencies]
proptest = "1.4"

[lints.clippy]
# `CompileError` is intentionally rich (message, span, source line,
# suggestion, filename). A prior refactor shrank it below clippy's
# `result_large_err` threshold; the diagnostics refinement that added
# `Option<String> file` pushed it back over. Boxing it behind every
# `Result<T, CompileError>` in the crate would touch hundreds of
# signatures for no runtime gain: a compiler produces at most one
# error per invocation before exiting.
result_large_err = "allow"